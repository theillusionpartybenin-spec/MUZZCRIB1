<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ZYRØ — THE HAZE EXPERIENCE (MUZZ CRIB)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              zyro: {
                50: "#fdf2f8",
                100: "#fce7f3",
                500: "#ec4899",
                600: "#db2777",
                900: "#831843",
                dark: "#0a0a0c",
                card: "#121216",
                border: "#27272a",
              },
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Outfit", "sans-serif"],
            },
          },
        },
      };
    </script>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Paystack & Helper Libraries -->
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="min-h-screen selection:bg-pink-500 selection:text-white pb-24 relative">
    <!-- AMBIENT BACKGROUND GLOWS -->
    <div
      class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-gradient-to-tr from-pink-600/20 to-purple-600/20 blur-[120px] rounded-full pointer-events-none ambient-blob -z-10"
    ></div>

    <!-- TOP NAVIGATION BAR -->
    <nav class="sticky top-0 z-50 glass-panel border-b border-zyro-border px-4 py-3">
      <div class="max-w-4xl mx-auto flex items-center justify-between">
        <div class="flex items-center space-x-2.5 cursor-pointer group" onclick="switchView('store')">
          <div
            class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-pink-600 to-purple-600 flex items-center justify-center font-black text-xl text-white tracking-wider glow-pink group-hover:rotate-12 transition duration-300"
          >
            Z
          </div>
          <span
            class="font-display font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-pink-200 to-pink-500 bg-clip-text text-transparent"
            >ZYRØ</span
          >
        </div>

        <div class="flex items-center space-x-2.5">
          <a
            href="admin.html"
            class="px-3.5 py-2 rounded-xl bg-pink-600/20 hover:bg-pink-600/30 text-xs font-semibold text-pink-300 transition border border-pink-500/30 flex items-center space-x-1.5 shadow-lg"
          >
            <i class="fa-solid fa-shield-halved"></i>
            <span>Admin Portal</span>
          </a>
        </div>
      </div>
    </nav>

    <!-- MAIN APP CONTAINER -->
    <main class="max-w-4xl mx-auto px-4 py-6" id="main-container">
      <!-- Renders Storefront dynamically -->
    </main>

    <!-- CHECKOUT MODAL -->
    <div
      id="checkout-modal"
      class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-4"
    >
      <div
        class="glass-panel w-full max-w-md rounded-3xl p-6 border border-zinc-800 relative max-h-[90vh] overflow-y-auto glow-pink"
      >
        <button
          onclick="closeCheckoutModal()"
          class="absolute top-4 right-4 text-zinc-400 hover:text-white w-8 h-8 rounded-full bg-zinc-900 flex items-center justify-center"
        >
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
        <h3 class="font-display font-bold text-2xl text-white mb-1">
          Complete Order
        </h3>
        <p id="checkout-summary-subtitle" class="text-xs text-zinc-400 mb-6">
          Pay securely via Paystack for instant QR &amp; PDF ticket passes.
        </p>

        <form id="checkout-form" onsubmit="processPaystackPayment(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1.5"
              >Full Name</label
            >
            <input
              type="text"
              id="buyer-name"
              required
              placeholder="Enter your full name"
              class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-500"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1.5"
              >Email Address (for Paystack receipt &amp; passes)</label
            >
            <input
              type="email"
              id="buyer-email"
              required
              placeholder="attendee@example.com"
              class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-500"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-1.5"
              >Phone Number</label
            >
            <input
              type="tel"
              id="buyer-phone"
              required
              placeholder="08012345678"
              class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-500"
            />
          </div>

          <div class="bg-zinc-900/90 rounded-2xl p-4 border border-zinc-800 space-y-2 my-4">
            <div class="flex justify-between text-xs text-zinc-400">
              <span id="checkout-tier-label">Ticket Type</span>
              <span id="checkout-qty-label">Qty: 1</span>
            </div>
            <div class="flex justify-between text-sm font-semibold text-white pt-2 border-t border-zinc-800">
              <span>Total Amount (NGN)</span>
              <span id="checkout-total-price" class="text-pink-400 font-display text-lg">₦0</span>
            </div>
          </div>

          <button
            type="submit"
            class="w-full py-3.5 bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 hover:opacity-95 text-white font-display font-bold rounded-2xl shadow-xl shadow-pink-600/30 transition flex items-center justify-center space-x-2"
          >
            <i class="fa-solid fa-lock text-xs"></i>
            <span>Pay with Paystack</span>
          </button>
        </form>
      </div>
    </div>

    <!-- SUCCESS PASS MODAL -->
    <div
      id="success-modal"
      class="fixed inset-0 z-50 bg-black/95 backdrop-blur-lg hidden flex items-center justify-center p-4"
    >
      <div
        class="glass-panel w-full max-w-lg rounded-3xl p-6 border border-pink-500/40 text-center max-h-[90vh] overflow-y-auto glow-pink"
      >
        <div
          class="w-16 h-16 bg-pink-500/20 text-pink-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl border border-pink-500/40 glow-pink"
        >
          <i class="fa-solid fa-check"></i>
        </div>
        <h3 class="font-display font-extrabold text-2xl text-white mb-1">
          Payment Confirmed!
        </h3>
        <p class="text-xs text-zinc-400 mb-6">
          Your QR passes are ready below and synced with Google Sheets &amp; gate records.
        </p>

        <div id="issued-tickets-container" class="space-y-4 mb-6">
          <!-- Dynamically rendered ticket passes -->
        </div>

        <div class="flex space-x-3">
          <button
            onclick="downloadAllPDFs()"
            class="flex-1 py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-semibold rounded-xl text-xs transition border border-zinc-700 shadow-lg"
          >
            <i class="fa-solid fa-download mr-1.5"></i> Download All PDFs
          </button>
          <button
            onclick="closeSuccessModal()"
            class="flex-1 py-3 bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-90 text-white font-semibold rounded-xl text-xs transition shadow-lg"
          >
            Done / Return Home
          </button>
        </div>
      </div>
    </div>

    <!-- MAIN APP SCRIPT -->
    <script>
      const PAYSTACK_PUBLIC_KEY = "pk_live_0354eebbaf5c46f4ebf16b309e2828d877e84f97";
      const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxTEcv5yWNK5mfrrufeBYrYo_2HFnjPOisF1EUohktuRjzx-T8jlTnzoEn2h43cDklQ/exec";

      const DEFAULT_TICKETS = [
        {
          id: "t1",
          name: "Early Birds",
          price: 10000,
          capacity: 0,
          sold: 0,
          desc: "Early bird tier allocation — currently sold out.",
        },
        {
          id: "t2",
          name: "Regular",
          price: 15000,
          capacity: 25,
          sold: 0,
          desc: "Standard access to THE HAZE EXPERIENCE (MUZZ CRIB) from 11:00 PM till dawn.",
        },
        {
          id: "t3",
          name: "Muzz Crib",
          price: 35000,
          capacity: 12,
          sold: 0,
          desc: "Elevated MUZZ CRIB experience with priority lounge access.",
        },
        {
          id: "t4",
          name: "Haze Void",
          price: 60000,
          capacity: 10,
          sold: 0,
          desc: "Exclusive Haze Void pass including accommodation and Muzz Crib access.",
        },
      ];

      let appState = {
        event: {
          name: "THE HAZE EXPERIENCE",
          tagline: "MUZZ CRIB • 11:00 PM TILL DAWN",
          date: "Saturday, Dec 05, 2026 • 11:00 PM Till Dawn",
          venue: "The Wills Apartment, Auchi",
          flyerUrl: "4.png",
          highlights: [
            {
              icon: "fa-moon",
              title: "11:00 PM – Dawn",
              desc: "All-night curated session",
            },
            {
              icon: "fa-location-dot",
              title: "The Wills Apartment",
              desc: "Auchi, Edo State",
            },
            {
              icon: "fa-shield-halved",
              title: "Private Security",
              desc: "Controlled entry &amp; QR check-in",
            },
            {
              icon: "fa-bolt",
              title: "Instant QR Pass",
              desc: "Verified via Paystack in NGN",
            },
          ],
        },
        tickets: JSON.parse(JSON.stringify(DEFAULT_TICKETS)),
        orders: [],
      };

      function loadData() {
        const storedOrders = localStorage.getItem("zyro_orders");
        const storedTickets = localStorage.getItem("zyro_tickets");
        if (storedOrders) {
          appState.orders = JSON.parse(storedOrders);
        }
        if (storedTickets) {
          const parsedTickets = JSON.parse(storedTickets);
          if (Array.isArray(parsedTickets) && parsedTickets.length === DEFAULT_TICKETS.length) {
            appState.tickets = parsedTickets;
          }
        }
      }

      function saveData() {
        localStorage.setItem("zyro_orders", JSON.stringify(appState.orders));
        localStorage.setItem("zyro_tickets", JSON.stringify(appState.tickets));
      }

      let selectedTicketForCheckout = null;
      let checkoutQuantity = 1;
      let lastCreatedTickets = [];

      document.addEventListener("DOMContentLoaded", () => {
        loadData();
        renderStorefront();
        startCountdown();
        init3DEffects();
      });

      function switchView() {
        loadData();
        renderStorefront();
        init3DEffects();
      }

      function init3DEffects() {
        const cards = document.querySelectorAll(".tilt-card");
        cards.forEach((card) => {
          card.addEventListener("mousemove", (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -10;
            const rotateY = ((x - centerX) / centerX) * 10;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
          });
          card.addEventListener("mouseleave", () => {
            card.style.transform = "rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";
          });
        });
      }

      function startCountdown() {
        const eventDate = new Date("December 05, 2026 23:00:00").getTime();
        setInterval(() => {
          const now = new Date().getTime();
          const distance = eventDate - now;
          if (distance < 0) return;

          const days = Math.floor(distance / (1000 * 60 * 60 * 24));
          const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((distance % (1000 * 60)) / 1000);

          const el = document.getElementById("countdown-timer");
          if (el) {
            el.innerHTML = `
              <div class="flex flex-wrap gap-2.5 text-center">
                <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl px-3.5 py-2.5 shadow-xl"><span class="block font-display font-bold text-xl text-pink-400">${days}</span><span class="text-[9px] uppercase tracking-wider text-zinc-500 font-semibold">Days</span></div>
                <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl px-3.5 py-2.5 shadow-xl"><span class="block font-display font-bold text-xl text-pink-400">${hours}</span><span class="text-[9px] uppercase tracking-wider text-zinc-500 font-semibold">Hours</span></div>
                <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl px-3.5 py-2.5 shadow-xl"><span class="block font-display font-bold text-xl text-pink-400">${minutes}</span><span class="text-[9px] uppercase tracking-wider text-zinc-500 font-semibold">Mins</span></div>
                <div class="bg-zinc-900/90 border border-zinc-800 rounded-2xl px-3.5 py-2.5 shadow-xl"><span class="block font-display font-bold text-xl text-pink-400">${seconds}</span><span class="text-[9px] uppercase tracking-wider text-zinc-500 font-semibold">Secs</span></div>
              </div>
            `;
          }
        }, 1000);
      }

      function renderStorefront() {
        const container = document.getElementById("main-container");
        const ticketsHTML = appState.tickets
          .map((t) => {
            const available = Math.max(0, t.capacity - t.sold);
            const soldOut = available <= 0;
            const maxSelect = Math.min(5, available);

            let qtyOptions = "";
            for (let q = 1; q <= maxSelect; q++) {
              qtyOptions += `<option value="${q}">${q} ${q === 1 ? "Ticket" : "Tickets"}</option>`;
            }

            return `
              <div class="tilt-card glass-panel rounded-3xl p-6 border border-zinc-800 hover:border-pink-500/50 transition flex flex-col justify-between shadow-2xl relative overflow-hidden group">
                <div class="absolute -right-12 -top-12 w-32 h-32 bg-pink-500/10 rounded-full blur-2xl group-hover:bg-pink-500/20 transition"></div>
                <div class="tilt-card-content">
                  <div class="flex justify-between items-start gap-2 mb-3">
                    <h4 class="font-display font-bold text-xl text-white">${t.name}</h4>
                    <span class="text-xs font-semibold px-3 py-1 rounded-full shrink-0 ${
                      soldOut
                        ? "bg-red-500/20 text-red-400 border border-red-500/30"
                        : "bg-pink-500/20 text-pink-400 border border-pink-500/30"
                    }">
                      ${soldOut ? "Sold Out" : `${available} left`}
                    </span>
                  </div>
                  <p class="text-xs text-zinc-400 mb-6 leading-relaxed">${t.desc}</p>
                  <div class="font-display font-black text-3xl text-white mb-6">₦${t.price.toLocaleString()}</div>
                </div>
                <div class="tilt-card-content">
                  ${
                    !soldOut
                      ? `
                        <div class="flex items-center space-x-2 mb-3">
                          <span class="text-xs text-zinc-400 font-medium">Quantity:</span>
                          <select id="qty-${t.id}" class="bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-pink-500">
                            ${qtyOptions}
                          </select>
                        </div>
                        <button onclick="openCheckout('${t.id}')" class="w-full py-3.5 bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-90 text-white font-display font-bold rounded-2xl text-xs transition shadow-lg shadow-pink-600/30 flex items-center justify-center space-x-2">
                          <i class="fa-solid fa-credit-card"></i>
                          <span>Pay with Paystack</span>
                        </button>
                      `
                      : `
                        <button disabled class="w-full py-3.5 bg-zinc-900 text-zinc-600 font-display font-bold rounded-2xl text-xs cursor-not-allowed border border-zinc-800">
                          Sold Out
                        </button>
                      `
                  }
                </div>
              </div>
            `;
          })
          .join("");

        const highlightsHTML = appState.event.highlights
          .map(
            (h) => `
              <div class="tilt-card glass-panel rounded-2xl p-5 border border-zinc-800 flex flex-col justify-between shadow-lg">
                <div class="w-10 h-10 rounded-xl bg-pink-500/10 border border-pink-500/30 flex items-center justify-center text-pink-400 mb-3 text-base">
                  <i class="fa-solid ${h.icon}"></i>
                </div>
                <div>
                  <h4 class="font-display font-bold text-white text-sm mb-1">${h.title}</h4>
                  <p class="text-xs text-zinc-400 leading-relaxed">${h.desc}</p>
                </div>
              </div>
            `
          )
          .join("");

        container.innerHTML = `
          <div class="tilt-card relative rounded-3xl overflow-hidden mb-10 border border-zinc-800 shadow-2xl">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0a0a0c] via-[#0a0a0c]/40 to-transparent z-10"></div>
            <img src="${appState.event.flyerUrl}" alt="Event Flyer" class="w-full h-[520px] sm:h-[620px] object-cover">
            <div class="absolute bottom-0 left-0 right-0 p-6 sm:p-8 z-20">
              <div class="inline-block px-3 py-1 rounded-full bg-pink-500/20 border border-pink-500/30 text-pink-300 text-[11px] font-bold uppercase tracking-wider mb-3 backdrop-blur-md">Official Event Experience</div>
              <h1 class="font-display font-black text-3xl sm:text-5xl text-white tracking-tight mb-2">${appState.event.name}</h1>
              <p class="text-xs sm:text-sm text-zinc-300 mb-4 max-w-xl leading-relaxed">${appState.event.tagline}</p>

              <div class="flex flex-wrap gap-4 text-xs text-zinc-300 mb-5 font-medium">
                <div class="flex items-center space-x-2 bg-black/50 px-3.5 py-2 rounded-xl border border-white/10 backdrop-blur-md"><i class="fa-regular fa-calendar text-pink-400"></i><span>${appState.event.date}</span></div>
                <div class="flex items-center space-x-2 bg-black/50 px-3.5 py-2 rounded-xl border border-white/10 backdrop-blur-md"><i class="fa-solid fa-location-dot text-pink-400"></i><span>${appState.event.venue}</span></div>
              </div>

              <div id="countdown-timer"></div>
            </div>
          </div>

          <div class="mb-12">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-6">
              <h3 class="font-display font-extrabold text-2xl text-white">Select Tickets</h3>
              <span class="text-xs text-zinc-400 bg-zinc-900 px-3 py-1.5 rounded-xl border border-zinc-800"><i class="fa-solid fa-lock text-pink-400 mr-1.5"></i>Paystack NGN Checkout</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              ${ticketsHTML}
            </div>
          </div>

          <div class="mb-12">
            <h3 class="font-display font-extrabold text-2xl text-white mb-6">Event Experience</h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
              ${highlightsHTML}
            </div>
          </div>
        `;
        init3DEffects();
      }

      function openCheckout(ticketId) {
        selectedTicketForCheckout = appState.tickets.find((t) => t.id === ticketId);
        if (!selectedTicketForCheckout) return;

        const available = Math.max(0, selectedTicketForCheckout.capacity - selectedTicketForCheckout.sold);
        if (available <= 0) {
          alert("This ticket tier is sold out.");
          return;
        }

        const qtySelect = document.getElementById(`qty-${ticketId}`);
        checkoutQuantity = qtySelect ? Math.min(parseInt(qtySelect.value, 10), available) : 1;

        document.getElementById("checkout-tier-label").innerText = `${selectedTicketForCheckout.name} (${checkoutQuantity}x)`;
        document.getElementById("checkout-qty-label").innerText = `Qty: ${checkoutQuantity}`;
        document.getElementById("checkout-total-price").innerText = `₦${(selectedTicketForCheckout.price * checkoutQuantity).toLocaleString()}`;
        document.getElementById("checkout-modal").classList.remove("hidden");
      }

      function closeCheckoutModal() {
        document.getElementById("checkout-modal").classList.add("hidden");
      }

      function processPaystackPayment(e) {
        e.preventDefault();
        if (!selectedTicketForCheckout) return;

        const name = document.getElementById("buyer-name").value.trim();
        const email = document.getElementById("buyer-email").value.trim();
        const phone = document.getElementById("buyer-phone").value.trim();
        const totalAmount = selectedTicketForCheckout.price * checkoutQuantity;
        const txRef = `ZYRO-${Date.now()}-${Math.floor(100 + Math.random() * 900)}`;

        closeCheckoutModal();

        const handler = PaystackPop.setup({
          key: PAYSTACK_PUBLIC_KEY,
          email: email,
          amount: totalAmount * 100,
          currency: "NGN",
          ref: txRef,
          metadata: {
            custom_fields: [
              { display_name: "Attendee Name", variable_name: "attendee_name", value: name },
              { display_name: "Phone Number", variable_name: "phone_number", value: phone },
              { display_name: "Ticket Tier", variable_name: "ticket_tier", value: selectedTicketForCheckout.name },
              { display_name: "Quantity", variable_name: "quantity", value: checkoutQuantity },
              { display_name: "Event", variable_name: "event_name", value: appState.event.name },
            ],
          },
          callback: function (response) {
            handleSuccessfulOrder({
              ref: response.reference || txRef,
              name: name,
              email: email,
              phone: phone,
              tier: selectedTicketForCheckout.name,
              qty: checkoutQuantity,
              total: totalAmount,
              date: new Date().toISOString().replace("T", " ").substring(0, 16),
              status: "Paid",
              scanned: false,
            });
          },
          onClose: function () {
            alert("Paystack payment window was closed before completion.");
          },
        });
        handler.openIframe();
      }

      function handleSuccessfulOrder(orderData) {
        // 1. Update ticket counts & local state
        const tierObj = appState.tickets.find((t) => t.name === orderData.tier);
        if (tierObj) {
          tierObj.sold = Math.min(tierObj.capacity, tierObj.sold + orderData.qty);
        }

        appState.orders.unshift(orderData);
        saveData();

        // 2. Automatically append attendee record to Google Sheet
        fetch(GOOGLE_SHEET_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(orderData),
        }).catch((err) => console.error("Google Sheet sync error:", err));

        // 3. Prepare QR pass data & open success modal
        lastCreatedTickets = [];
        for (let i = 1; i <= orderData.qty; i++) {
          lastCreatedTickets.push({
            ticketId: `${orderData.ref}-${i}`,
            name: orderData.name,
            tier: orderData.tier,
            event: appState.event.name,
            date: appState.event.date,
            venue: appState.event.venue,
          });
        }

        renderSuccessModal();
      }

      function renderSuccessModal() {
        const container = document.getElementById("issued-tickets-container");
        container.innerHTML = lastCreatedTickets
          .map(
            (t, idx) => `
              <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-left relative shadow-xl">
                <div class="flex justify-between items-start mb-2">
                  <div>
                    <span class="text-[10px] font-bold text-pink-400 uppercase tracking-wider">${t.tier}</span>
                    <h4 class="font-display font-bold text-white text-base">${t.name}</h4>
                  </div>
                  <span class="text-[10px] bg-zinc-800 text-zinc-400 px-2.5 py-1 rounded-full font-mono">Pass #${idx + 1}</span>
                </div>
                <div class="text-xs text-zinc-400 space-y-1 mb-4">
                  <div><i class="fa-regular fa-calendar mr-1.5 text-pink-400"></i> ${t.date}</div>
                  <div><i class="fa-solid fa-location-dot mr-1.5 text-pink-400"></i> ${t.venue}</div>
                  <div class="font-mono text-zinc-500 text-[10px]">ID: ${t.ticketId}</div>
                </div>
                <div id="qrcode-${idx}" class="flex justify-center bg-white p-2.5 rounded-xl w-32 h-32 mx-auto shadow-md"></div>
              </div>
            `
          )
          .join("");

        document.getElementById("success-modal").classList.remove("hidden");

        setTimeout(() => {
          lastCreatedTickets.forEach((t, idx) => {
            const el = document.getElementById(`qrcode-${idx}`);
            if (!el) return;
            el.innerHTML = "";
            new QRCode(el, { text: t.ticketId, width: 110, height: 110 });
          });
        }, 100);
      }

      function closeSuccessModal() {
        document.getElementById("success-modal").classList.add("hidden");
        renderStorefront();
      }

      function downloadAllPDFs() {
        const { jsPDF } = window.jspdf;
        lastCreatedTickets.forEach((t) => {
          const doc = new jsPDF();
          doc.setFillColor(10, 10, 12);
          doc.rect(0, 0, 210, 297, "F");

          doc.setTextColor(236, 72, 153);
          doc.setFontSize(22);
          doc.text("ZYRØ EVENT PASS", 20, 30);

          doc.setTextColor(255, 255, 255);
          doc.setFontSize(16);
          doc.text(t.event, 20, 45);

          doc.setFontSize(11);
          doc.setTextColor(180, 180, 180);
          doc.text(`Attendee: ${t.name}`, 20, 60);
          doc.text(`Ticket Tier: ${t.tier}`, 20, 70);
          doc.text(`Date: ${t.date}`, 20, 80);
          doc.text(`Venue: ${t.venue}`, 20, 90);
          doc.text(`Ticket ID: ${t.ticketId}`, 20, 100);

          doc.save(`ZYRO-Ticket-${t.ticketId}.pdf`);
        });
      }
    </script>
  </body>
</html>
